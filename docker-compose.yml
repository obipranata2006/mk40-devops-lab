services:
  db:
    image: postgres:16-alpine
    container_name: mk40-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_secret
      POSTGRES_DB: devops_inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-bridge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_inventory"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend-api:v1.0.0
    container_name: mk40-backend
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      STUDENT_NIM: "42430003"
      STUDENT_NAME: "Nama Lengkap Saya"
      STORAGE_MODE: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "devops_user"
      DB_PASSWORD: "devops_secret"
      DB_NAME: "devops_inventory"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-bridge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend-web:v1.0.0
    container_name: mk40-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-bridge-net

volumes:
  pgdata:
    name: mk40_pgdata_volume

networks:
  app-bridge-net:
    name: mk40_bridge_network
    driver: bridge
