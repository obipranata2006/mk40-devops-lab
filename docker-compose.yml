services:
  db:
    image: postgres:16-alpine
    container_name: mk40-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend-api:v1.0.0
    container_name: mk40-backend
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      STUDENT_NIM: ${STUDENT_NIM}
      STUDENT_NAME: ${STUDENT_NAME}
      STORAGE_MODE: "postgres"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - frontend-net
      - backend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend-web:v1.0.0
    container_name: mk40-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

volumes:
  pgdata:
    name: mk40_pgdata_volume

networks:
  frontend-net:
    name: mk40_frontend_net
    driver: bridge
  backend-net:
    name: mk40_backend_net
    driver: bridge
